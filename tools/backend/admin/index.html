<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星际幸存者 · 运行观察</title><link rel="stylesheet" href="/admin/style.css"></head><body>
<aside class="rail"><a class="brand" href="/admin"><span class="mark">SC</span><span>星际幸存者<small>运行观察 / ADMIN</small></span></a><nav aria-label="管理导航"><button data-tab="overview" class="active">01　运行总览</button><button data-tab="funnel">02　关卡进程</button><button data-tab="usage">03　部队与构筑</button><button data-tab="cards">04　卡牌与经济</button><button data-tab="performance">05　加载与性能</button><button data-tab="feedback">06　玩家反馈</button><button data-tab="archive">07　历史日汇总</button></nav><div class="rail-bottom"><span id="account">尚未登录</span><button id="logout" hidden>退出登录</button><a href="/">返回游戏 ↗</a></div></aside>
<main><header class="page-head"><div><span class="eyebrow">SC2 SURVIVORS / OPERATIONS</span><h1 id="heading">运行总览</h1><p>从授权样本观察游戏的运行与体验。</p></div><span class="stamp" id="updated">等待登录</span></header>
<div id="error" role="alert" hidden></div>
<section id="login-panel" class="login-panel"><div class="login-intro"><span class="eyebrow">AUTHORIZED ACCESS</span><h2>管理员登录</h2><p>此处仅供已由服务端建立的管理员使用。统计未启用时，玩家仍可正常游玩。</p><div class="rule"></div><small>仅授权浏览器样本<br>Asia/Shanghai 日期<br>联系方式独立导出权限</small></div><form id="login"><label>管理员名称<input name="username" autocomplete="username" required maxlength="40"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="primary" type="submit">登录管理后台 →</button><p id="login-status" role="status"></p></form></section>
<section id="workspace" hidden><form id="filters" class="filters"><label>开始日期<input type="date" name="from" required></label><label>结束日期<input type="date" name="to" required></label><label>种族<select name="race"><option value="">所有种族</option><option value="terran">人族</option><option value="zerg">虫族</option><option value="protoss">神族</option></select></label><label>难度<select name="difficulty"><option value="">所有难度</option><option value="easy">简单</option><option value="normal">普通</option><option value="hard">困难</option><option value="hell">地狱</option></select></label><label>场景<select name="mode"><option value="">战役与无尽</option><option value="campaign">战役</option><option value="endless">无尽</option></select></label><label>最低天赋点数<input name="minLevel" type="number" min="0" max="80" value="0"></label><label>最高天赋点数<input name="maxLevel" type="number" min="0" max="80" value="80"></label><label class="build">构建版本<input name="build" maxlength="64" placeholder="留空显示全部版本"></label><label class="check"><input type="checkbox" name="diagnostic" value="1">包含开发与诊断样本</label><button type="submit" class="primary">应用筛选</button></form>
<div class="toolbar"><p id="scope">授权浏览器 ≠ 自然人数</p><button id="export">导出当前筛选 CSV</button></div><section id="content" aria-live="polite"></section><footer>报表每30秒更新。战绩来自客户端，仅用于观察；构筑关联不代表因果。未结束战局保留为未完成。</footer></section>
</main><dialog id="feedback-detail"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><div id="feedback-fields"></div></dialog><script type="module" src="/admin/app.js"></script></body></html>
