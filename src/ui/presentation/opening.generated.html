<style>
#scs-opening-visual { width:100%; }
#scs-opening-visual .scs-preview-stage { width:100%; height:576px; display:flex; align-items:center; justify-content:center; }
#scs-opening-visual .scs-screen { position:relative; width:100%; max-width:1024px; aspect-ratio:16/9; overflow:hidden; isolation:isolate; background:#02070d; color:#e1f5ff; color-scheme:dark; font-family:'Segoe UI',Arial,sans-serif; --scs-ice:#61dfff; --scs-white:#e1f5ff; --scs-muted:#83a5b6; }
#scs-opening-visual .scs-screen, #scs-opening-visual .scs-screen * { box-sizing:border-box; }
#scs-opening-visual .scs-background { position:absolute; inset:-6%; width:112%; height:112%; object-fit:cover; user-select:none; pointer-events:none; animation:scs-nebula-drift 38s ease-in-out infinite alternate; }
#scs-opening-visual .scs-stars { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#scs-opening-visual .scs-planet { position:absolute; width:57%; right:-14%; top:-27%; pointer-events:none; opacity:.85; animation:scs-planet-drift 40s ease-in-out infinite alternate; }
#scs-opening-visual .scs-planet img { display:block; width:100%; height:auto; }
#scs-opening-visual .scs-cruiser { position:absolute; width:37%; left:-3%; bottom:11%; pointer-events:none; opacity:.82; animation:scs-cruiser-drift 27s ease-in-out infinite alternate; }
#scs-opening-visual .scs-cruiser img { display:block; width:100%; height:auto; }
#scs-opening-visual .scs-cruiser-far { width:19%; left:auto; right:-2%; top:49%; bottom:auto; opacity:.52; animation-duration:43s; animation-delay:-16s; }
#scs-opening-visual .scs-engine { position:absolute; right:0; top:53%; width:11%; height:32%; background:radial-gradient(ellipse at 38% 48%,rgba(114,222,255,.45),rgba(50,167,255,.14) 40%,transparent 72%); filter:blur(3px); mix-blend-mode:screen; animation:scs-engine-pulse 2.8s ease-in-out infinite alternate; }
#scs-opening-visual .scs-vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 43%,rgba(0,4,10,.72) 0%,rgba(0,4,10,.43) 30%,rgba(0,4,10,.12) 52%,transparent 72%); pointer-events:none; }
#scs-opening-visual .scs-orbits { position:absolute; left:50%; top:42%; width:54%; aspect-ratio:1; transform:translate(-50%,-50%); opacity:.7; pointer-events:none; }
#scs-opening-visual .scs-orbit { position:absolute; inset:0; border-radius:50%; mask:radial-gradient(circle closest-side,transparent 96.7%,#000 97.3% 98%,transparent 98.8%); background:conic-gradient(from 16deg,transparent 0deg 34deg,rgba(98,225,255,.06) 35deg,rgba(98,225,255,.85) 72deg 92deg,transparent 93deg 216deg,rgba(98,225,255,.04) 217deg,rgba(98,225,255,.7) 240deg 264deg,transparent 265deg); filter:drop-shadow(0 0 7px rgba(75,216,255,.5)); animation:scs-orbit-turn 26s linear infinite; }
#scs-opening-visual .scs-orbit-inner { inset:9%; opacity:.48; animation-duration:39s; animation-direction:reverse; }
#scs-opening-visual .scs-ticks { inset:-5%; opacity:.38; animation-duration:65s; background:repeating-conic-gradient(from 0deg,transparent 0deg 5deg,rgba(128,229,255,.65) 5deg 5.4deg,transparent 5.4deg 8deg); mask:radial-gradient(circle closest-side,transparent 97%,#000 97.3% 98.6%,transparent 99%); }
#scs-opening-visual .scs-scan { position:absolute; inset:0; pointer-events:none; overflow:hidden; opacity:.35; mix-blend-mode:screen; }
#scs-opening-visual .scs-scan::after { content:''; position:absolute; width:100%; height:8%; top:-10%; background:linear-gradient(transparent,rgba(85,206,255,.045) 78%,rgba(114,238,255,.17) 99%,transparent); animation:scs-scan-pass 8s linear infinite; }
#scs-opening-visual .scs-frame { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; mask:linear-gradient(to right,#000 0% 2.4%,transparent 4.4% 95.6%,#000 97.6% 100%),linear-gradient(to bottom,#000 0% 3.2%,transparent 7.3% 87%,#000 94% 100%); }
#scs-opening-visual .scs-title { position:absolute; left:50%; top:21%; width:66%; transform:translateX(-50%); margin:0; filter:drop-shadow(0 6px 14px rgba(0,0,0,.8)); }
#scs-opening-visual .scs-title img { display:block; width:100%; height:auto; user-select:none; pointer-events:none; }
#scs-opening-visual .scs-loader { position:absolute; left:50%; top:72%; width:43%; transform:translateX(-50%); text-align:center; }
#scs-opening-visual .scs-loader-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; font-size:12px; line-height:1.2; letter-spacing:.22em; font-weight:500; text-shadow:0 0 12px rgba(110,220,255,.3); }
#scs-opening-visual .scs-phase { white-space:nowrap; }
#scs-opening-visual .scs-percent { font-variant-numeric:tabular-nums; letter-spacing:.1em; min-width:4ch; text-align:right; color:var(--scs-ice); }
#scs-opening-visual .scs-track { position:relative; height:9px; background:rgba(29,59,80,.65); }
#scs-opening-visual .scs-fill { position:absolute; inset:0 auto 0 0; width:68%; background:repeating-linear-gradient(90deg,#38c4eb 0px,#66e6ff 9px,transparent 9px,transparent 11px); box-shadow:0 0 14px rgba(61,209,255,.3); }
#scs-opening-visual .scs-fill::after { content:''; position:absolute; right:0; top:-1px; width:2px; height:11px; background:#e1fdff; box-shadow:0 0 9px 2px rgba(65,223,255,.75); }
#scs-opening-visual .scs-detail { margin:12px 0 0; font-size:11px; line-height:1.3; letter-spacing:.2em; font-weight:400; color:#b7d8e8; text-shadow:0 1px 3px #000; }
#scs-opening-visual .scs-grain { position:absolute; inset:0; opacity:.13; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(0,5,10,.24) 3px,rgba(0,5,10,.24) 4px); }
#scs-opening-visual .scs-screen.scs-portrait { aspect-ratio:9/16; max-width:324px; }
#scs-opening-visual .scs-portrait .scs-background { object-position:48% 50%; }
#scs-opening-visual .scs-portrait .scs-planet { width:122%; top:-17%; right:-35%; opacity:.77; }
#scs-opening-visual .scs-portrait .scs-cruiser { width:96%; left:-13%; bottom:5%; }
#scs-opening-visual .scs-portrait .scs-cruiser-far { width:43%; left:auto; right:-11%; top:20%; bottom:auto; opacity:.38; }
#scs-opening-visual .scs-portrait .scs-vignette { background:radial-gradient(ellipse at 50% 48%,rgba(0,4,10,.8) 0%,rgba(0,4,10,.56) 28%,rgba(0,4,10,.12) 52%,transparent 74%); }
#scs-opening-visual .scs-portrait .scs-orbits { top:43%; width:139%; opacity:.55; }
#scs-opening-visual .scs-portrait .scs-title { top:33%; width:92%; }
#scs-opening-visual .scs-portrait .scs-loader { width:74%; top:64%; }
#scs-opening-visual .scs-portrait .scs-loader-row { letter-spacing:.14em; }
#scs-opening-visual .scs-portrait .scs-detail { letter-spacing:.12em; }
#scs-opening-visual.scs-still .scs-screen * { animation-play-state:paused !important; }
#scs-opening-visual.scs-still .scs-scan::after { animation-play-state:paused; }
@keyframes scs-nebula-drift { from { transform:translate(-1%,-1%) scale(1.01); } to { transform:translate(1.5%,1.1%) scale(1.045); } }
@keyframes scs-planet-drift { from { transform:translate(0,0) rotate(-12deg); } to { transform:translate(-18px,16px) rotate(-7deg); } }
@keyframes scs-cruiser-drift { from { transform:translate(24px,7px) rotate(-1deg); } to { transform:translate(-27px,-9px) rotate(1deg); } }
@keyframes scs-engine-pulse { from { opacity:.2; transform:scale(.88); } to { opacity:.85; transform:scale(1.12); } }
@keyframes scs-orbit-turn { to { transform:rotate(360deg); } }
@keyframes scs-scan-pass { from { top:-10%; } to { top:105%; } }
@keyframes scs-title-reveal { from { opacity:0; filter:brightness(1.65) drop-shadow(0 0 18px rgba(61,209,255,.26)); } to { opacity:1; filter:brightness(1) drop-shadow(0 6px 14px rgba(0,0,0,.8)); } }
@media (max-width:540px) {
 #scs-opening-visual .scs-screen:not(.scs-portrait) .scs-loader { width:72%; top:69%; }
 #scs-opening-visual .scs-screen:not(.scs-portrait) .scs-loader-row { font-size:11px; letter-spacing:.1em; margin-bottom:6px; }
 #scs-opening-visual .scs-screen:not(.scs-portrait) .scs-track { height:6px; }
 #scs-opening-visual .scs-screen:not(.scs-portrait) .scs-fill::after { height:8px; }
 #scs-opening-visual .scs-screen:not(.scs-portrait) .scs-detail { margin-top:7px; letter-spacing:.08em; }
}
@media (orientation:landscape) and (max-height:500px) {
 #scs-opening-visual .scs-preview-stage { height:300px; }
 #scs-opening-visual .scs-screen:not(.scs-portrait) { max-width:1024px; height:300px; aspect-ratio:auto; }
 #scs-opening-visual .scs-screen:not(.scs-portrait) .scs-title { width:min(66%,352px); }
 #scs-opening-visual .scs-screen.scs-portrait { max-width:168px; }
 #scs-opening-visual .scs-portrait .scs-loader { width:84%; }
 #scs-opening-visual .scs-portrait .scs-loader-row { font-size:11px; letter-spacing:.04em; gap:5px; margin-bottom:6px; }
 #scs-opening-visual .scs-portrait .scs-detail { letter-spacing:.04em; margin-top:7px; }
}
@media (prefers-reduced-motion:reduce) {
 #scs-opening-visual .scs-screen *, #scs-opening-visual .scs-scan::after { animation:none !important; }
 #scs-opening-visual .scs-scan { display:none; }
}

/* Replace preview framing with the real viewport; original layer placement remains. */
#scs-opening-visual{position:fixed;inset:0;z-index:2000;width:100%;height:100%;background:#02070d;isolation:isolate}
#scs-opening-visual .scs-screen,#scs-opening-visual .scs-screen.scs-portrait{width:100%;height:100%;max-width:none;aspect-ratio:auto}
#scs-opening-visual .scs-fill{width:0}
#scs-opening-visual .scs-loader{padding-bottom:env(safe-area-inset-bottom)}
#scs-opening-visual .scs-track.is-indeterminate .scs-fill{width:18%;animation:scs-indeterminate 1.5s ease-in-out infinite alternate}
@keyframes scs-indeterminate{from{left:0}to{left:82%}}
@media(prefers-reduced-motion:reduce){#scs-opening-visual .scs-track.is-indeterminate .scs-fill{left:41%;animation:none}}

 function finish(){if(ended)return;ended=true;if(frame)cancelAnimationFrame(frame);observer.disconnect();removeEventListener('resize',resize);preference.removeEventListener('change',restart);document.removeEventListener('visibilitychange',restart);document.removeEventListener('sc2-opening-progress',progress);document.removeEventListener('sc2-opening-finish',finish);document.getElementById('game-root')?.removeAttribute('inert');root.remove();document.querySelector('[data-action="menu-new"]')?.focus({preventScroll:true});}
 const observer=new ResizeObserver(resize);observer.observe(screen);addEventListener('resize',resize);preference.addEventListener('change',restart);document.addEventListener('visibilitychange',restart);document.addEventListener('sc2-opening-progress',progress);document.addEventListener('sc2-opening-finish',finish);resize();restart();
})();
