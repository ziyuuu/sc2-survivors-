name: Simulation and web build
on:
  push:
    branches: ['main', 'codex/**', 'v3/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime assets and original provenance test sources
        run: git lfs pull --include="deploy/runtime/assets/**,deploy/runtime/fun-props/**,deploy/runtime/mission-assets/**,assets/private/m3/**,assets/private/dds/**" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run assets:restore
      - run: node --import tsx tools/prepare-ci-provenance.mts
      - name: Restore missing pinned original test sources
        shell: pwsh
        run: ./tools/fetch-sc2-casc.ps1 -TargetFile '../.cache/ci-provenance-targets.json' -OutputFile 'reports/local/ci-source-provenance.json' -SkipAudio
      - run: npm test
      - run: npm run typecheck
      - run: npm run docs:check
      - run: node tools/generate-m2-talents.mjs --check
      # CI checks source compilation without uploading or redistributing game assets.
      # Full friend-demo packaging intentionally requires all mandatory local assets.
      - run: npx vite build
