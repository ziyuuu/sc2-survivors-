name: Simulation and web build
on:
  push:
    branches: ['v3/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run assets:prepare
      - run: npm run typecheck
      # CI checks source compilation without uploading or redistributing game assets.
      # Full friend-demo packaging intentionally requires all mandatory local assets.
      - run: npx vite build
