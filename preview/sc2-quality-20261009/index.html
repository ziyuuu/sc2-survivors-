<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工业战场 · 画质修复样板</title><link rel="stylesheet" href="./style.css"></head>
<body><main><canvas id="battle" aria-label="真实引擎工业战场" tabindex="0"></canvas></main><button id="exitClean">退出纯画面</button>
<header><strong>工业战场</strong><span class="tag">画质修复样板</span><select id="look" aria-label="画面方案"><option value="restored">修复画面</option><option value="baseline">原单位材质/光照</option></select><select id="roster" aria-label="编队"><option value="terran">人族机械部队</option><option value="protoss">神族材质与护障</option><option value="zerg">虫族甲壳</option></select><button id="play">开始交战</button><button id="reset">重置</button><button id="clean">纯画面</button><span id="status">准备原始资源…</span></header>
<footer><span>点按移动 · 拖动查看 · 滚轮缩放 · 空格暂停</span><span id="stats"></span><details><summary>测试记录</summary><pre id="report"></pre><div class="tuning"><label><input type="checkbox" id="ao" checked>接触阴影</label><label><input type="checkbox" id="shadow" checked>投影</label><label><input type="checkbox" id="msaa">多重采样</label><label><input type="checkbox" id="bloom" checked>泛光</label><label><input type="checkbox" id="environment">环境反射</label><select id="shadowSize" aria-label="投影分辨率"><option value="2048">2048</option><option value="1024" selected>1024</option></select><select id="bloomScale" aria-label="泛光分辨率"><option value="1">全尺寸泛光</option><option value="0.5" selected>半尺寸泛光</option></select></div><button id="bench">测量 10 秒</button><button id="prepare">准备交战（暂停）</button><button id="barrier">触发真实受击</button><button id="death">触发一次真实死亡</button><button id="step">推进 12 帧</button><button id="step60">推进 60 帧</button></details></footer>
<div id="loading"><div><b>工业战场</b><p id="loadtext">准备原始资源…</p></div></div><script type="module" src="./main.ts"></script></body></html>
