<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"/><title>五图环境小样</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11191d;color:#eef3f4;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;height:100dvh;display:flex;flex-direction:column}header{padding:12px 20px;background:#142025;border-bottom:1px solid #35464b;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:18px;margin:0}small{color:#aabdc4}button,select,a.control{font:inherit;min-height:44px;padding:9px 13px;background:#223138;color:#f4f7f8;border:1px solid #566c73;border-radius:5px;cursor:pointer;text-decoration:none}button:hover,select:hover,a.control:hover{background:#30464e}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8edfce;outline-offset:2px}button[aria-pressed=true]{background:#b4e6d9;color:#163b31;border-color:#b4e6d9}button:disabled{opacity:.5;cursor:wait}nav{display:flex;gap:8px;flex-wrap:wrap}#viewport{flex:1;min-height:180px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#notice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#142025ed;padding:20px;border:1px solid #60777d;max-width:90%;text-align:center}#notice:empty{display:none}footer{padding:10px 20px;background:#142025;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#status{color:#b4e6d9}label{display:flex;gap:8px;align-items:center}@media(max-width:600px){header{gap:8px;padding:8px 12px}h1{font-size:16px}small{display:none}nav button{padding:8px;font-size:13px}footer{padding:8px 12px;font-size:12px}.tools{gap:6px}.tools button,.tools a{font-size:13px;padding:7px 10px}label{font-size:13px}} </style>
<header><div><h1>五图环境小样</h1><small>地表 · 贴地 · 岸线</small></div><label>地图<select id="theme"><option value="industrial">工业区</option><option value="mar-sara">玛萨拉</option><option value="char">查尔</option><option value="ice">冰原</option><option value="frontier">边疆矿区</option></select></label><nav id="sites" aria-label="观察点"></nav></header>
<main id="viewport" aria-label="可拖动的三维环境小样"><canvas tabindex="0" aria-label="场景，方向键平移，加减缩放"></canvas><div id="notice" role="status">正在准备环境…</div></main>
<footer><div><strong id="status" aria-live="polite"></strong><div>拖动或方向键平移 · 滚轮或 + − 缩放</div></div><div class="tools"><button id="pause" aria-pressed="false">暂停</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="reset">复位视角</button><a class="control" id="compare" href="?before=1">查看旧版</a></div></footer>
<script type="module">const p=new URLSearchParams(location.search);import(p.has('before')?'./before.js':'./sample.js');</script></html>
