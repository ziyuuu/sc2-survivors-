*{box-sizing:border-box}html,body{margin:0;background:#101a20;color:#d5e7eb;font:14px 'Microsoft YaHei',system-ui,sans-serif;height:100%}body{display:flex;flex-direction:column}button,select{font:inherit;background:#1c303b;color:#d5e7eb;border:1px solid #446370;min-height:44px;padding:10px 14px;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:#dfbb71;color:#f8d995;background:#304047}button:focus-visible,select:focus-visible{outline:2px solid #fff}button:disabled{opacity:.45}header{display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #45616a;align-items:center}header strong{font-size:19px;letter-spacing:1px}header span{color:#96b2bd;font-size:12px}#heroes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 14px;background:#152731}#stage{position:relative;flex:1;min-height:310px;overflow:hidden}#battle{width:100%;height:100%;display:block;touch-action:none}#pod-labels{position:absolute;inset:0;pointer-events:none}.enemy-label,.friendly-label{position:absolute}#interface{position:absolute;inset:0;background:#162630;display:grid;place-content:center;text-align:center;z-index:4}#interface[hidden]{display:none}#stats{position:absolute;right:14px;top:12px;display:flex;gap:14px;background:#13232dcc;padding:9px 13px;border:1px solid #496372;pointer-events:none;color:#b7cfd7}#stats b{color:#f1d399}#aura{position:absolute;left:14px;bottom:14px;color:#cbdadf;background:#10222ce6;max-width:440px;padding:10px 14px;border-left:2px solid #d4b878;pointer-events:none;font-size:12px}footer{border-top:1px solid #47616c;background:#13232d;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}#portrait img{width:54px;height:54px;border:1px solid #b5995e;object-fit:contain;background:#0b171e}.hero-info{width:170px}#name{font-size:16px;color:#f2d592;margin-bottom:7px}.vital{height:6px;background:#273c40;width:100%;margin-bottom:5px}#vital-fill{height:100%;background:#80d29e}#health{font-size:12px;color:#a9c2ca}.buttons{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.hint{font-size:12px;color:#90a8b3;padding:0 16px 9px;background:#13232d}#cast{border-color:#d4b878}#boss-result{color:#ebd191;font-size:12px;margin-left:auto}@media(max-width:720px){header{padding:10px}header span{display:none}header strong{font-size:16px}#heroes{grid-template-columns:repeat(3,1fr);padding:6px}#heroes button{font-size:12px;padding:8px 4px}footer{gap:8px;padding:8px}#portrait img{width:44px;height:44px}.hero-info{width:calc(100% - 54px)}.buttons{width:100%;gap:5px}.buttons button,.buttons select{padding:8px;font-size:12px}#stage{min-height:300px}#stats{font-size:10px;gap:8px;padding:7px}#aura{left:8px;bottom:8px;max-width:calc(100% - 16px);padding:8px 10px;font-size:11px}.hint{font-size:10px;padding:0 8px 8px}#boss-result{margin-left:0}}
