<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全量画面方案验证</title><link rel="stylesheet" href="./style.css"></head><body>
<main><canvas id="battle" aria-label="全部单位与五图实际渲染验证"></canvas><div id="identities"></div></main>
<header><strong>全量画面验证</strong><select id="group" aria-label="单位组"></select><select id="theme" aria-label="地图"></select><select id="mode" aria-label="画面候选"><option value="baseline">正式画面基线</option><option value="shadow">仅投影</option><option value="lighting">仅分图光照</option><option value="contact">投影与接触阴影</option><option value="surface">地表变化候选</option><option value="atmosphere">环境氛围候选</option><option value="combined">组合候选</option><option value="composition">构图与镜头候选</option><option value="fxaa">FXAA 对照</option><option value="msaa4">MSAA4 对照</option><option value="direct">直接输出诊断</option><option value="no-bloom">关闭泛光诊断</option></select><select id="focus" aria-label="检查视距"><option value="">整组战场视距</option></select><select id="render-quality" aria-label="原生质量"><option value="native">质量 · 原生</option><option value="balanced">质量 · 均衡</option><option value="performance">质量 · 性能</option></select><select id="render-ratio" aria-label="渲染倍率"><option value="1">倍率 · 1</option><option value="0.75">倍率 · 0.75</option><option value="1.5">倍率 · 1.5</option></select><select id="effect-quality" aria-label="特效质量"><option value="full">特效 · 完整</option><option value="balanced">特效 · 均衡</option><option value="low">特效 · 精简</option></select><button id="load">载入</button><button id="reset">重置</button><button id="next">下一组</button></header>
<nav><button id="idle">待机 1 秒</button><button id="move">移动 1 秒</button><button id="prepare">准备目标</button><button id="combat">交战 1 秒</button><button id="cast">施法与形态</button><button id="step12">推进 0.2 秒</button><button id="step60">推进 1 秒</button><button id="death">真实死亡</button><button id="step300">推进 5 秒</button><button id="hit">原生命中</button><button id="actors">工人/载体过程</button><button id="actors-death">建筑/载体死亡</button><button id="roster-suite">全部身份横竖屏画面</button><button id="capture-frame">导出当前画面</button><button id="suite-visual">五图画面对照（无计时）</button><button id="suite-visual-one">单图画面对照（无计时）</button><button id="suite">五图图形批次</button><button id="suite-one">单图图形批次</button><button id="bench-live">连续实测 10 秒</button><button id="bench">测量 10 秒</button><button id="play">连续运行</button><button id="clean">纯画面</button></nav>
<footer><button id="label-toggle">身份标签</button><button id="back" style="display:none">返回控制</button><span id="status">准备中</span><span id="summary"></span><details><summary>完整记录</summary><pre id="report"></pre></details><details><summary>批次记录</summary><pre id="suite-report"></pre></details></footer>
<script type="module" src="./main.ts"></script><pre id="capture-report" hidden></pre></body></html>
